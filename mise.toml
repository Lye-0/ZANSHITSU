[tools]
node = "24.19.0"
pnpm = "11.19.0"

[tasks.install]
description = "Install locked project dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Start the local game"
run = "pnpm dev"

[tasks.build]
description = "Typecheck and build"
run = "pnpm build"

[tasks."dev:wifi"]
description = "Start the development server on the home LAN"
run = "pnpm dev:wifi"

[tasks.test]
description = "Run puzzle and save-state tests"
run = "pnpm test"

[tasks.preview]
description = "Serve the production build locally"
run = "pnpm preview --port 4187 --strictPort"

[tasks."build:pages"]
description = "Build for GitHub Pages"
run = "pnpm build:pages"

[tasks."preview:pages"]
description = "Preview the GitHub Pages project path"
run = "pnpm preview:pages"
